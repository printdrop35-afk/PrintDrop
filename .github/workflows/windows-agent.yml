name: Agent Windows PrintDrop

on:
  push:
    paths: ["agent/**", ".github/workflows/windows-agent.yml"]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the installer as a GitHub Release

jobs:
  # Same builder as the installer shipped in backend/agent_dist (agent/installer/build_nsis.sh).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y nsis msitools && pip install Pillow
      - name: Construction de PrintDrop-Setup.exe
        run: bash agent/installer/build_nsis.sh "$PWD/out"
      - uses: actions/upload-artifact@v4
        with:
          name: PrintDrop-Setup
          path: out/*

  # Real install / self-test / start / uninstall on GitHub's Windows images
  # (Server 2022 = Windows 10 21H2 base, Server 2025 = Windows 11 24H2 base). Real shop PCs with printers must still be checked.
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrintDrop-Setup
          path: dist
      - name: Installation silencieuse
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter PrintDrop-Setup-*.exe | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installation échouée (code $($p.ExitCode))" }
          $app = Join-Path $env:ProgramFiles 'PrintDrop'
          foreach ($f in 'printdrop_agent.py','SumatraPDF.exe','python\pythonw.exe','Desinstaller-PrintDrop.exe') { if (-not (Test-Path (Join-Path $app $f))) { throw "Manquant : $f" } }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PrintDrop -ErrorAction SilentlyContinue).PrintDrop
          if (-not $run -or $run -notlike '*--background*') { throw "Démarrage automatique non configuré" }
          Get-Process pythonw -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: Auto-test (Python embarqué, pywin32, Pillow, Tk, spouleur, SumatraPDF, appairage printdrop.fr)
        shell: pwsh
        run: |
          $app = Join-Path $env:ProgramFiles 'PrintDrop'
          & "$app\python\python.exe" -c "import tkinter, win32print, win32com.client, pythoncom, PIL, requests; print('imports ok', tkinter.TkVersion)"
          if ($LASTEXITCODE -ne 0) { throw "Import impossible dans le Python embarqué" }
          & "$app\python\python.exe" "$app\printdrop_agent.py" --self-test "$pwd\selftest.json" https://printdrop.fr
          $code = $LASTEXITCODE
          Get-Content selftest.json
          if ($code -ne 0) { throw "Auto-test en échec" }
      - name: Démarrage en arrière-plan (10 s sans plantage)
        shell: pwsh
        run: |
          $app = Join-Path $env:ProgramFiles 'PrintDrop'
          $p = Start-Process "$app\python\pythonw.exe" -ArgumentList "`"$app\printdrop_agent.py`"",'--background' -PassThru
          Start-Sleep 10
          if ($p.HasExited) { Get-Content "$env:LOCALAPPDATA\PrintDrop\agent.log" -ErrorAction SilentlyContinue; throw "L'agent s'est arrêté" }
          Stop-Process -Id $p.Id -Force
      - name: Désinstallation silencieuse
        shell: pwsh
        run: |
          $app = Join-Path $env:ProgramFiles 'PrintDrop'
          Start-Process "$app\Desinstaller-PrintDrop.exe" -ArgumentList '/S' -Wait
          for ($i = 0; $i -lt 30 -and (Test-Path "$app\printdrop_agent.py"); $i++) { Start-Sleep 2 }
          if (Test-Path "$app\printdrop_agent.py") { throw "Fichiers toujours présents" }
          if (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name PrintDrop -ErrorAction SilentlyContinue) { throw "Démarrage automatique non retiré" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-${{ matrix.os }}
          path: selftest.json

  release:
    needs: test  # published only if every Windows test passed
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PrintDrop-Setup
          path: dist
      - name: Version
        run: echo "AGENT_VERSION=$(ls dist/PrintDrop-Setup-*.exe | grep -oP '\d+\.\d+\.\d+')" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ env.AGENT_VERSION }}
          name: Agent Windows PrintDrop ${{ env.AGENT_VERSION }}
          make_latest: true
          body: |
            Installateur de l'agent Windows PrintDrop (Windows 10/11 64 bits), testé automatiquement sur Windows Server 2022 et 2025.
            Pour le proposer aux boutiques : copiez-le dans backend/agent_dist (puis redéployez) ou envoyez-le dans Super-admin › Agent Windows.
          files: dist/*
