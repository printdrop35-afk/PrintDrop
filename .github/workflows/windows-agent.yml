name: Agent Windows PrintDrop

on:
  push:
    paths: ["agent/**", ".github/workflows/windows-agent.yml"]
  workflow_dispatch:

permissions:
  contents: write  # needed to publish the installer as a GitHub Release

jobs:
  build:
    runs-on: windows-latest
    env:
      AGENT_VERSION: "0.2.0"
      # Code signing: add these two repository secrets (Settings → Secrets and variables → Actions) to sign; empty = unsigned build
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r agent/requirements.txt pyinstaller==6.11.1
      - name: Compilation de PrintDrop.exe
        working-directory: agent
        run: pyinstaller --onefile --noconsole --name PrintDrop --hidden-import win32timezone printdrop_agent.py
      - name: SumatraPDF (moteur d'impression PDF, GPLv3)
        working-directory: agent
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.sumatrapdfreader.org/dl/rel/3.5.2/SumatraPDF-3.5.2-64.zip" -OutFile sumatra.zip
          Expand-Archive sumatra.zip -DestinationPath sumatra
          Copy-Item (Get-ChildItem sumatra -Filter *.exe -Recurse | Select-Object -First 1).FullName dist/SumatraPDF.exe
      - name: Signature de PrintDrop.exe (si certificat configuré)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "PrintDrop" agent/dist/PrintDrop.exe
          if ($LASTEXITCODE -ne 0) { throw "Échec de la signature de PrintDrop.exe" }
      - name: Installateur (Inno Setup)
        working-directory: agent/installer
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" printdrop.iss
      - name: Signature de l'installateur (si certificat configuré)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          Get-ChildItem agent/dist/PrintDrop-Setup-*.exe | ForEach-Object {
            & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p "$env:WINDOWS_CERT_PASSWORD" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "Installateur PrintDrop" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Échec de la signature de l'installateur" }
            & $signtool verify /pa $_.FullName
          }
          Remove-Item "$env:RUNNER_TEMP\cert.pfx" -Force
      - name: Avertissement si non signé
        if: env.WINDOWS_CERT_PFX_BASE64 == ''
        run: echo "::warning::Installateur NON signé (secrets WINDOWS_CERT_PFX_BASE64 / WINDOWS_CERT_PASSWORD absents) - Windows SmartScreen affichera un avertissement."
      - uses: actions/upload-artifact@v4
        with:
          name: PrintDrop-Setup
          path: agent/dist/PrintDrop-Setup-*.exe
      - name: Nom stable pour le lien de téléchargement
        shell: pwsh
        run: Copy-Item agent/dist/PrintDrop-Setup-*.exe agent/dist/PrintDrop-Setup.exe
      - name: Publication (GitHub Release)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-v${{ env.AGENT_VERSION }}
          name: Agent Windows PrintDrop ${{ env.AGENT_VERSION }}
          make_latest: true
          body: |
            Installateur de l'agent Windows PrintDrop (Windows 10/11).
            Lien direct permanent : https://github.com/${{ github.repository }}/releases/latest/download/PrintDrop-Setup.exe
            Si l'installateur n'est pas signé, Windows SmartScreen peut afficher « Informations complémentaires → Exécuter quand même ».
          files: |
            agent/dist/PrintDrop-Setup.exe
            agent/dist/PrintDrop-Setup-*.exe
